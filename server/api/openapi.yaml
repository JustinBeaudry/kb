{
  "openapi": "3.0.3",
  "info": {
    "title": "Private Memory API",
    "version": "0.1.0",
    "description": "Private single-owner API. Authentication derives Principal and Origin; submitted data cannot grant trust. Only implemented capabilities may return success. Unavailable capabilities use a 503 Problem. Remote schema version 3 is independent of preserved local schema-v2."
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/v1/events:append": {
      "post": {
        "operationId": "appendEvents",
        "responses": {
          "202": {
            "description": "Success from an implemented operation only.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReceiptsResult"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AppendEventsInput"
              }
            }
          }
        }
      }
    },
