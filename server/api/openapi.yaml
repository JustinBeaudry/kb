  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "OpaqueID": {
        "type": "string",
        "minLength": 1,
        "pattern": "\\S",
        "description": "Nonempty opaque identifier. Never a database elementId."
      },
      "Role": {
        "type": "string",
        "enum": [
          "collector",
          "agent",
          "verifier",
          "owner"
        ]
      },
      "ClaimStatus": {
        "type": "string",
        "enum": [
          "candidate",
          "verified",
          "superseded",
          "disputed",
          "invalidated",
          "rejected"
        ]
      },
      "OriginTrust": {
        "type": "string",
        "enum": [
          "submitted",
          "collector_attested",
          "gateway_observed",
          "owner_authenticated"
        ]
      },
      "VerificationOutcome": {
        "type": "string",
        "enum": [
          "supported",
          "unsupported",
          "ambiguous"
        ]
      },
      "Completeness": {
        "type": "string",
        "enum": [
          "complete",
          "partial",
          "withheld"
        ]
      },
      "RetrievalMode": {
        "type": "string",
        "enum": [
          "orientation",
          "evidence",
          "working"
        ]
      },
      "Scope": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "project_id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "task_id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "session_id": {
            "$ref": "#/components/schemas/OpaqueID"
          }
        },
        "required": [
          "project_id"
        ]
      },
      "Applicability": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "repository_revision": {
            "type": "string"
          },
          "dirty_digest": {
            "type": "string"
          },
          "environment": {
            "type": "string"
          },
          "versions": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "valid_from": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp."
          },
          "valid_until": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp."
          }
        },
        "required": []
      },
      "Origin": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "client_id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "trust": {
            "$ref": "#/components/schemas/OriginTrust"
          },
          "attestation_id": {
            "$ref": "#/components/schemas/OpaqueID"
          }
        },
        "required": [
          "client_id",
          "trust"
        ]
      },
      "EvidenceRef": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "artifact_id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "digest": {
            "type": "string",
            "minLength": 1,
            "description": "Content integrity digest; checked at the owning service boundary."
          },
          "locator": {
            "type": "string"
          },
          "source_revision": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "origin": {
            "$ref": "#/components/schemas/Origin"
          },
          "applicability": {
            "$ref": "#/components/schemas/Applicability"
          }
        },
        "required": [
          "artifact_id",
          "digest",
          "locator",
          "source_revision",
          "origin",
          "applicability"
        ]
      },
      "EventInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "digest": {
            "type": "string",
            "minLength": 1,
            "description": "Content integrity digest; checked at the owning service boundary."
          },
          "scope": {
            "$ref": "#/components/schemas/Scope"
          },
          "kind": {
            "type": "string",
            "enum": [
              "message",
              "tool_call",
              "tool_result",
              "checkpoint",
              "artifact"
            ]
          },
          "observed_at": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp."
          },
          "payload_artifact_id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "sequence": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "completeness": {
            "$ref": "#/components/schemas/Completeness"
          }
        },
        "required": [
          "id",
          "idempotency_key",
          "digest",
          "scope",
          "kind",
          "observed_at",
          "payload_artifact_id",
          "sequence",
          "completeness"
        ]
      },
      "AppendEventsInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "events": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EventInput"
            },
            "minItems": 1,
            "maxItems": 100
          }
        },
        "required": [
          "events"
        ]
      },
      "Receipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "duplicate": {
            "type": "boolean"
          },
          "state": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "duplicate",
          "state"
        ]
      },
      "ReceiptsResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema_version": {
            "type": "string",
            "enum": [
              "3"
            ]
          },
          "receipts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Receipt"
            }
          }
        },
        "required": [
          "schema_version",
          "receipts"
        ]
      },
      "ArtifactInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "scope": {
            "$ref": "#/components/schemas/Scope"
          },
          "digest": {
            "type": "string",
            "minLength": 1,
            "description": "Content integrity digest; checked at the owning service boundary."
          },
          "bytes": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 8388608
          },
          "policy_revision": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "content_base64": {
            "type": "string",
            "format": "byte",
            "maxLength": 11184812
          },
          "source_locator": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096,
            "description": "Exact source locator for this chunk; retained without rewriting offsets."
          },
          "source_path": {
            "type": "string",
            "maxLength": 4096,
            "description": "Slash-separated relative source identifier; exact or directory-prefix policy exclusions, no globs. Client field filtering precedes network. This is not a server filesystem path."
          }
        },
        "required": [
          "scope",
          "digest",
          "bytes",
          "policy_revision",
          "content_base64",
          "source_locator"
        ],
        "description": "Base64 transfer is transport only. The service receives decoded bytes and verifies digest/length. No caller-supplied trust."
      },
      "Artifact": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "digest": {
            "type": "string",
            "minLength": 1,
            "description": "Content integrity digest; checked at the owning service boundary."
          },
          "scope": {
            "$ref": "#/components/schemas/Scope"
          },
          "bytes": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "state": {
            "type": "string",
            "enum": [
              "staged",
              "ready",
              "deleted"
            ]
          },
          "policy_revision": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp."
          },
          "source_locator": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096,
            "description": "Exact source locator for this chunk; retained without rewriting offsets."
          },
          "source_path": {
            "type": "string",
            "maxLength": 4096,
            "description": "Slash-separated relative source identifier; exact or directory-prefix policy exclusions, no globs. Client field filtering precedes network. This is not a server filesystem path."
          },
          "object_available": {
            "type": "boolean",
            "description": "Authoritative object health, independent of immutable ready manifest. False is ineligible evidence until reconciliation succeeds."
          }
        },
        "required": [
          "id",
          "digest",
          "scope",
          "bytes",
          "state",
          "policy_revision",
          "source_locator",
          "object_available"
        ]
      },
      "ArtifactResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema_version": {
            "type": "string",
            "enum": [
              "3"
            ]
          },
          "artifact": {
            "$ref": "#/components/schemas/Artifact"
          }
        },
        "required": [
          "schema_version",
          "artifact"
        ]
      },
      "CompleteArtifactInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "digest": {
            "type": "string",
            "minLength": 1,
            "description": "Content integrity digest; checked at the owning service boundary."
          }
        },
        "required": [
          "digest"
        ]
      },
      "ReceiptResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema_version": {
            "type": "string",
            "enum": [
              "3"
            ]
          },
          "receipt": {
            "$ref": "#/components/schemas/Receipt"
          }
        },
        "required": [
          "schema_version",
          "receipt"
        ]
      },
      "SubmittedEvidenceRef": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "artifact_id": {
            "$ref": "#/components/schemas/OpaqueID"
          },
          "digest": {
