            }
          }
        ]
      },
      "put": {
        "operationId": "putPolicy",
        "responses": {
          "200": {
            "description": "Success from an implemented operation only.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PolicyResult"
                }
              }
            }
          },
          "default": {
