version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    # Modules recorded in deploy/versions.json fail TestVersionsManifestMatchesGoModule
    # until the manifest is updated in the same PR. Only the graph edition and
    # version in the manifest affect which backups restore.
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /integrations/hermes
    schedule:
      interval: weekly
    ignore:
      # Runtime pins equal Hermes Agent's own pins, so installing the provider
      # never changes Hermes' environment. Move them only with Hermes.
      - dependency-name: httpx
      - dependency-name: pydantic
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/deploy]
    schedule:
      interval: weekly
    # Base images recorded in deploy/versions.json fail
    # TestVersionsManifestMatchesDockerfiles until the manifest moves with them.
    ignore:
      # Neo4j upgrades change the backup format and are pinned together with
      # deploy/versions.json; upgrade them deliberately, never automatically.
      - dependency-name: neo4j
