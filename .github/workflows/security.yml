name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-vulnerabilities:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: server/go.sum
      - name: govulncheck (reachable call paths only)
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  js-vulnerabilities:
    name: JavaScript vulnerabilities (bun audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun audit
