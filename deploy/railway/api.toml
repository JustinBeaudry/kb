[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.api"
watchPatterns = ["server/**", "deploy/**"]
[deploy]
healthcheckPath = "/livez"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
drainingSeconds = 90
overlapSeconds = 0
[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
