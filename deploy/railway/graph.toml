[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.graph"
watchPatterns = ["server/**", "deploy/**", "scripts/Neo4jInitialPassword.java"]
[deploy]
healthcheckPath = "/livez"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
drainingSeconds = 120
overlapSeconds = 0
[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
